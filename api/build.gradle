// API contract module — published as a JAR, consumed by the service module.
// Contains DTOs, exceptions, and the auto-configuration that consumers import.
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.25'
}
