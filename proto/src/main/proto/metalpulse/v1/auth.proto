syntax = "proto3";

package metalpulse.v1;

option java_multiple_files = true;
option java_package = "com.smarthmalik.metalpulse.grpc.v1";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string token_type = 2;
  int64 user_id = 3;
  string username = 4;
  string email = 5;
  string role = 6;
}
