# ==========================================
# MetalPulse — Precious Metals Price API
# ==========================================
spring.application.name=MetalPulse
server.port=8080

# ==========================================
# Local environment variables
# ==========================================
spring.config.import=optional:file:.env[.properties]

# ==========================================
# gRPC
# ==========================================
grpc.server.port=9090
# GrpcServerSecurityAutoConfiguration is incompatible with Spring Framework 7.0;
# auth is handled by GrpcAuthInterceptor instead.
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# ==========================================
# Database
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT — use a strong secret (min 32 chars)
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# External Gold Price API
# ==========================================
app.goldbroker.base-url=https://goldbroker.com/api

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================
# Kafka — trade event pipeline
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false

# ==========================================
# Redis — cache-aside for spot prices & JWT blacklist
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# Resilience4j — Circuit Breaker (Goldbroker API)
# ==========================================
# Retry 3 times with exponential backoff (500ms → 1s → 2s) before circuit breaker records a failure
resilience4j.retry.instances.goldbrokerApi.max-attempts=3
resilience4j.retry.instances.goldbrokerApi.wait-duration=500ms
resilience4j.retry.instances.goldbrokerApi.enable-exponential-backoff=true
resilience4j.retry.instances.goldbrokerApi.exponential-backoff-multiplier=2

resilience4j.circuitbreaker.instances.goldbrokerApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.goldbrokerApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.goldbrokerApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.goldbrokerApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.goldbrokerApi.register-health-indicator=true

# ==========================================
# Resilience4j — Circuit Breaker (AI Assistant)
# ==========================================
resilience4j.circuitbreaker.instances.assistant.sliding-window-size=10
resilience4j.circuitbreaker.instances.assistant.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.assistant.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.assistant.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.assistant.register-health-indicator=true

# ==========================================
# AI Assistant — Gemini Developer API (Spring AI)
# One API key covers both chat and embeddings.
# ==========================================
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=text-embedding-004

# ==========================================
# Actuator + Prometheus metrics
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ==========================================
# Logging
# ==========================================
logging.level.com.smarthmalik=INFO
logging.level.org.springframework.security=WARN
