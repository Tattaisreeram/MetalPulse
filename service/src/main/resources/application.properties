# ==========================================
# MetalPulse — Precious Metals Price API
# ==========================================
spring.application.name=MetalPulse
server.port=8080

# ==========================================
# Local environment variables
# ==========================================
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Database
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT — use a strong secret (min 32 chars)
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# External Gold Price API
# ==========================================
app.goldbroker.base-url=https://goldbroker.com/api

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================
# Logging
# ==========================================
logging.level.com.smarthmalik=INFO
logging.level.org.springframework.security=WARN
