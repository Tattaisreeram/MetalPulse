# JWT secret override — main properties reads from ${JWT_SECRET} env var which won't exist in CI
app.jwt.secret=test-secret-needs-to-be-at-least-32-characters-long

# Point goldbroker client at a dummy URL — MetalPriceHelper is mocked in all ITs
app.goldbroker.base-url=http://localhost:9999

# Kafka admin won't crash the context if no broker is reachable during tests
spring.kafka.admin.fail-fast=false

# KafkaConfig reads this via @Value — must be present or context fails to load.
# Dummy value is safe: TradeServiceImpl never calls the KafkaTemplate in these tests.
spring.kafka.bootstrap-servers=localhost:9092

# Prevent @KafkaListener containers from starting so consumers don't flood logs
# trying to connect to the non-existent broker above.
spring.kafka.listener.auto-startup=false

# grpc-server-spring-boot-starter:3.1.0 uses @AutoConfigureAfter(SecurityAutoConfiguration.class)
# referencing the Spring Boot 3.x package which no longer exists in Spring Boot 4.
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
