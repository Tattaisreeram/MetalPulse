# JWT secret override — main properties reads from ${JWT_SECRET} env var which won't exist in CI
app.jwt.secret=test-secret-needs-to-be-at-least-32-characters-long

# Point goldbroker client at a dummy URL — MetalPriceHelper is mocked in all ITs
app.goldbroker.base-url=http://localhost:9999

# Kafka admin won't crash the context if no broker is reachable during tests
spring.kafka.admin.fail-fast=false
