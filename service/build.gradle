// Runnable Spring Boot application module.
// Depends on the :api contract module for DTOs and exceptions.
plugins {
    id 'org.springframework.boot'
}

bootRun {
    workingDir = rootProject.projectDir
}

// grpc-server-spring-boot-starter:3.1.0 uses InternalGlobalInterceptors which was
// removed in gRPC 1.65+. Spring AI pulls gRPC 1.70, so pin everything to 1.63.
configurations.all {
    resolutionStrategy.force(
        'io.grpc:grpc-core:1.63.0',
        'io.grpc:grpc-api:1.63.0',
        'io.grpc:grpc-context:1.63.0',
        'io.grpc:grpc-netty-shaded:1.63.0',
        'io.grpc:grpc-stub:1.63.0',
        'io.grpc:grpc-protobuf:1.63.0',
        'io.grpc:grpc-protobuf-lite:1.63.0',
        'io.grpc:grpc-inprocess:1.63.0',
        'io.grpc:grpc-util:1.63.0'
    )
}

dependencies {
    implementation project(':api')
    implementation project(':proto')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Redis cache
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Circuit breaker + retry (Resilience4j)
    // resilience4j-spring-boot3 is no longer BOM-managed in Spring Boot 4; pin explicitly.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    // spring-boot-starter-aop was removed in Spring Boot 4; AspectJ weaver is its only real dep.
    implementation 'org.aspectj:aspectjweaver'

    // Observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Kafka event streaming
    implementation 'org.springframework.kafka:spring-kafka'

    // Database migrations
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
    implementation 'com.mysql:mysql-connector-j'

    // JWT — JJWT 0.12.x
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Spring AI — RAG + tool calling (Google Gemini Developer API; one key covers chat and embeddings)
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'

    // OpenTelemetry — distributed traces + OTLP export
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}
